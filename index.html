---
layout: default
title: "Home Page"
---

<main class="container">
    <div class="link-list">
        {% for post in site.posts %}
            <!-- Removed invalid <ul>/<li> nesting. Clean semantic cards. -->
            <a href="{{ post.url }}" class="link-item">
                <div class="link-content">
                    <span class="tag">{{ post.title }}</span>
                    <span class="link-desc">{{ post.description }}</span>
                </div>
                <span class="link-meta">📅 {{ post.date | date_to_string }}</span>
            </a>
        {% endfor %}
    </div>
</main>
