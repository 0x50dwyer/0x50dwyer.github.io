---
layout: default
title: Notes
---


<header class="page-header">
    <h1>Technical Notes</h1>
</header>
<main class="container">
    <div class="link-list">
         <ul>
         {% for post in site.posts %}
            <a href="{{ post.url }}" class="link-item">
                <span class="tag">{{ post.title }}</span>
                <span>{{ post.description }}</span>
                <span class="link-meta">📅 {{ post.date | date_to_string }}</span>
            </a>
        {% endfor %}
        </ul>
    </div>
</main>
