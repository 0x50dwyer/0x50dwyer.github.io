---
layout: default
---
<!-- SIDEBAR NAV -->
<aside class="sidebar">
    <nav>
        <p style="font-weight:bold; margin-bottom: 0.5rem;">On This Page</p>

        {% for item in page.nav_items %}
            <a href="#{{ item.id | escape }}">{{ item.label | escape }}</a>
        {% endfor %}
    </nav>
</aside>

<!-- MAIN CONTENT -->
<main class="main-content">
     <div id="quote-container">
        <p id="quote-text"></p>
        <p id="quote-author"></p>
    </div>
    <h1>{{ page.title }}</h1>

    {{ content }}
</main>
